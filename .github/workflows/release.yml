name: Release to npm

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify release identity
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(p.name, 'pi-copy-picker');
          assert.match(p.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${p.version}`);
          assert.equal(p.repository?.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          const [major, minor, patch] = execFileSync('npm', ['--version'], {encoding:'utf8'}).trim().split('.').map(Number);
          assert(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1), 'npm >=11.5.1 is required');
          JS
          git merge-base --is-ancestor HEAD origin/main
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check types, tests, and real tarball
        run: npm run check
      - name: Publish with trusted publishing
        run: npm publish --access public --provenance
